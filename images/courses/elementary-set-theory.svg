  <rect x="520" y="82" width="268" height="145" rx="17" fill="#0d6efd" stroke="#000000" stroke-width="4"/>
  <g font-family="DejaVu Sans, sans-serif" font-size="28" font-weight="700" text-anchor="middle">
    <text x="246" y="126">A</text>
    <text x="654" y="126">B</text>
    <text x="450" y="171" font-size="48">+</text>
  </g>
  <g fill="#000000">
